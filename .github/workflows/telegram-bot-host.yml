name: telegram-bot-host

# هاست ۲۴/۷ ربات روی GitHub Actions — مستقل از هر سرویس دیگر (نه کلودفلر)
# هر اجرا ~۵ساعت۴۸دقیقه می‌ماند؛ cron هر ۵ دقیقه یک اجرای جایگزین آماده نگه می‌دارد.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: telegram-bot-host
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      AI_HOST_URL: http://127.0.0.1:11434/v1
      AI_HOST_KEY: ollama
      AI_HOST_MODEL: qwen2.5:7b
      AI_TIMEOUT: "35"
      # هاست پشتیبان: ورکر کلودفلر (Workers AI + RAG + کش D1)
      AI_API_URL: https://dual-diagnosis-clinical-hub.elasa2next.workers.dev/api/chat
      AI_CF_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Restore local database from private data repo
        run: |
          mkdir -p data
          rm -rf /tmp/datarepo
          if git clone -q --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/SBZ-EDU/dual-diagnosis-bot-data.git" /tmp/datarepo 2>/dev/null; then
            cp -f /tmp/datarepo/data/* data/ 2>/dev/null || true
            echo "Previous bot data restored."
          else
            git init -q /tmp/datarepo
            git -C /tmp/datarepo checkout -q -b main
            git -C /tmp/datarepo remote add origin "https://x-access-token:${DATA_REPO_TOKEN}@github.com/SBZ-EDU/dual-diagnosis-bot-data.git"
            echo "Fresh start — no previous data."
          fi
          mkdir -p /tmp/datarepo/data

      - name: Heartbeat (keeps scheduled workflow enabled)
        run: |
          date -u +%FT%TZ > .heartbeat
          git add -f .heartbeat
          git -c user.name="bot-heartbeat" -c user.email="bot@users.noreply.github.com" \
            commit -qm "heartbeat [skip ci]" || true
          git push -q origin HEAD:heartbeat --force || true
          git reset -q --hard origin/master

      - name: Install dependencies
        run: pip install -q -r bot/requirements.txt

      - name: Setup self-hosted AI (Ollama + Qwen 3B)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh || true
          if ! curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
            sleep 5
          fi
          ollama pull qwen2.5:7b
          ollama pull bge-m3
          ollama list

      - name: Build semantic vectors (one-time, bge-m3)
        run: |
          if [ -f data/vectors_semantic.npz ]; then
            echo "semantic vectors restored from private data repo."
          else
            python3 bot/embed_corpus.py
            cp -f data/vectors_semantic.npz /tmp/datarepo/data/
            git -C /tmp/datarepo add -A
            git -C /tmp/datarepo -c user.name="bot-sync" -c user.email="bot@users.noreply.github.com" \
              commit -qm "semantic vectors [skip ci]" || true
            git -C /tmp/datarepo push -q origin main || true
          fi

      - name: AI smoke test on the real host
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.request
          sys.path.insert(0, 'bot')
          from scenarios import SCENARIOS, build_eval_prompt
          sc = next(s for s in SCENARIOS if s["id"] == "sc-overdose")
          eval_prompt = build_eval_prompt(sc, "فوراً ۱۱۵ می‌گیرم، او را روی پهلو می‌خوابانم و کنارش می‌مانم.")
          import telegram_bot as tb
          rag_q = "اگر بیمار دوباره مصرف کرد، خانواده چه کند؟"
          rag_prompt, srcs = tb.build_grounded_question(rag_q)
          sys_prompt = tb.AI_SYSTEM_PROMPT + " " + tb.ROLE_GUIDES["family"]
          from scenarios import local_eval
          lscore, _ = local_eval(sc, "فوراً ۱۱۵ می‌گیرم، او را روی پهلو می‌خوابانم و کنارش می‌مانم.")
          out = []
          # ۱) ارزیابی سناریو با AI
          body = json.dumps({"model": "qwen2.5:7b",
                             "messages": [{"role": "user", "content": eval_prompt}],
                             "max_tokens": 400, "temperature": 0.3}).encode()
          req = urllib.request.Request("http://127.0.0.1:11434/v1/chat/completions",
                                       data=body, method="POST",
                                       headers={"content-type": "application/json"})
          ans = json.loads(urllib.request.urlopen(req, timeout=600).read())["choices"][0]["message"]["content"]
          import re as _re
          m = _re.search(r"نمره[^0-9۰-۹]{0,15}?([0-9۰-۹]+)", ans)
          ai = int(m.group(1).translate(str.maketrans("۰۱۲۳۴۵۶۷۸۹", "0123456789"))) if m else None
          out.append(f"===== scenario-eval =====\nAI raw:\n{ans}\n\nlocal={lscore} ai={ai} → نهایی={max(lscore, ai) if ai is not None else lscore}")
          # ۲) پاسخ RAG مستند
          body = json.dumps({"model": "qwen2.5:7b",
                             "messages": [{"role": "system", "content": sys_prompt},
                                          {"role": "user", "content": rag_prompt}],
                             "max_tokens": 500, "temperature": 0.3}).encode()
          req = urllib.request.Request("http://127.0.0.1:11434/v1/chat/completions",
                                       data=body, method="POST",
                                       headers={"content-type": "application/json"})
          ans2 = json.loads(urllib.request.urlopen(req, timeout=600).read())["choices"][0]["message"]["content"]
          mode = "semantic" if tb._VECS is not None else "idf"
          out.append(f"===== family-rag (retrieval={mode}) =====\n{ans2}\n\nمنابع بازیابی‌شده: {srcs}")
          print("\n".join(out)[:400])
          open("ai-smoke.txt", "w", encoding="utf-8").write("\n\n".join(out))
          EOF
          cp ai-smoke.txt /tmp/datarepo/ 2>/dev/null || true
          git -C /tmp/datarepo add -A || true
          git -C /tmp/datarepo -c user.name="bot-sync" -c user.email="bot@users.noreply.github.com" \
            commit -qm "ai smoke test [skip ci]" || true
          git -C /tmp/datarepo push -q origin main || true

      - name: Host & database health check (multi-host test)
        run: |
          echo "===== تست سلامت هاست‌ها و پایگاه داده ====="
          echo "--- ۱) هاست اصلی: Ollama محلی (qwen2.5:7b) ---"
          if curl -s --max-time 20 http://127.0.0.1:11434/api/tags | grep -q qwen; then
            echo "✅ Ollama primary: OK"
          else
            echo "⚠️ Ollama primary: DOWN (بافت به هاست پشتیبان)"
          fi
          echo "--- ۲) هاست پشتیبان: ورکر کلودفلر ---"
          HEALTH=$(curl -s --max-time 25 https://dual-diagnosis-clinical-hub.elasa2next.workers.dev/api/health || echo '{}')
          echo "$HEALTH" | head -c 400; echo
          CHAT=$(curl -s --max-time 30 -X POST https://dual-diagnosis-clinical-hub.elasa2next.workers.dev/api/chat \
            -H "content-type: application/json" \
            -d '{"question":"تست سلامت: علامت هشدار عود؟","role":"family"}' || echo '{}')
          echo "$CHAT" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            if d.get('answer'):
                print('✅ CF fallback chat: OK — منبع:', d.get('source'), '| تأخیر:', d.get('latency_ms'), 'ms')
            else:
                print('⚠️ CF fallback chat: پاسخ نداد —', str(d)[:150])
          except Exception as e:
            print('⚠️ CF fallback chat: خراب —', e)
          "
          echo "--- ۳) پایگاه داده‌ی محلی (SQLite بازیابی‌شده) ---"
          python3 -c "
          import glob, os, sqlite3
          files = glob.glob('data/*.db') + glob.glob('data/*.sqlite*') + glob.glob('data/*.json')
          print('فایل‌های داده:', files if files else '(جدید — بدون داده‌ی قبلی)')
          for f in glob.glob('data/*.db') + glob.glob('data/*.sqlite*'):
              try:
                  n = sqlite3.connect(f).execute('SELECT count(*) FROM sqlite_master').fetchone()[0]
                  print(f'  ✅ {f}: سالم ({n} شیء)')
              except Exception as e:
                  print(f'  ⚠️ {f}: {e}')
          "
          echo "===== پایان تست سلامت ====="

      - name: Run bot (~5h48m) with periodic data sync
        run: |
          sync_data() {
            cp -f data/bot.db /tmp/datarepo/data/ 2>/dev/null || true
            cp -f data/bot_data.pkl /tmp/datarepo/data/ 2>/dev/null || true
            git -C /tmp/datarepo add -A
            git -C /tmp/datarepo -c user.name="bot-sync" -c user.email="bot@users.noreply.github.com" \
              commit -qm "data sync $(date -u +%H:%M) [skip ci]" || return 0
            git -C /tmp/datarepo push -q origin main || true
          }
          ( while true; do sleep 300; sync_data; done ) &
          SYNC_PID=$!
          timeout --signal=INT --kill-after=90 348m python3 bot/telegram_bot.py
          sync_data
          kill $SYNC_PID 2>/dev/null || true
