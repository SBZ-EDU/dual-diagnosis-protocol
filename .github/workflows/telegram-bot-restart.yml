name: telegram-bot-restart

# به‌محض پایانِ «طبیعی» هر اجرای telegram-bot-host (خاتمه‌ی ~۶ساعته یا خطا)، فوراً اجرای جدید می‌سازد.
# اجراهای cancelled نادیده گرفته می‌شوند تا حلقه‌ی restart↔cancel نگیرد
# (رانِ در صفِ انتظار با رانِ جدیدترِ همان گروهِ concurrency جایگزین و کنسل می‌شود؛
#  اگر این رویداد هم restart می‌ساخت، چرخه‌ی بی‌نهایت هر ~۱۵ ثانیه رخ می‌داد).
on:
  workflow_run:
    workflows: [telegram-bot-host]
    types: [completed]

permissions:
  actions: write

jobs:
  relaunch:
    runs-on: ubuntu-latest
    # فقط پایانِ واقعی (موفق/ناموفق) — نه لغوِ صف
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Relaunch bot host immediately
        run: |
          sleep 5
          # اگر هاستی در حال اجراست، اجرای جدید نساز
          LIVE=$(gh api "repos/SBZ-EDU/dual-diagnosis-protocol/actions/workflows/telegram-bot-host.yml/runs?per_page=5" --jq '[.workflow_runs[] | select(.status=="in_progress")] | length')
          if [ "$LIVE" != "0" ]; then
            echo "host already in progress — skip relaunch"
            exit 0
          fi
          gh api -X POST repos/SBZ-EDU/dual-diagnosis-protocol/actions/workflows/telegram-bot-host.yml/dispatches -f ref=master
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
